[package]
name = "libretto"
version = "0.1.0-rc.5"
edition = "2024"
repository = "https://github.com/JadedBlueEyes/libretto"
description = "The Matrix Archiver"
homepage = "https://github.com/JadedBlueEyes/libretto?tab=readme-ov-file"
license = "MPL-2.0"

[dependencies]
askama = { version = "0.16.0", features = ["serde_json"] }

axum = { version = "0.8.6", features = ["macros"] }
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
clap-verbosity-flag = "3.0.4"
color-eyre = "0.6.5"
config = "0.15.18"
dirs = "6.0.0"
eyeball-im = "0.8.0"
futures = { version = "0.3.31", default-features = false }
futures-util = "0.3.31"
icu = "2.1.1"
jiff = "0.2.16"
listenfd = "1.0.2"
# git = "https://github.com/matrix-org/matrix-rust-sdk.git", rev="40e3cd3c224b359c312c1f3c55b0d4f7b2be4346"
matrix-sdk = { version = "0.16.0", features = ["eyre", "native-tls"], default-features = true}
rand = "0.10.1"
regex = "1.12.2"
reqwest = "0.13.3"
rpassword = "7.4.0"

ruma = {version = "0.14.0", features = ["html-matrix", "html"] } # match rust-sdk

rust-embed = { version = "8.9.0", features = ["axum", "mime-guess", "include-exclude"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "macros", "migrate", "json"] }
strum = { version = "0.28.0" }
strum_macros = "0.28.0"
tokio = { version = "1.48.0", features = ["rt", "signal"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
tracing-forest = { version = "0.3.0", features = [
    # "uuid",
    "chrono",
    "smallvec",
    "tokio",
    "serde",
    "env-filter",
    "ansi",
#     "defer"
] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
vite-manifest = "0.1.0"

[dev-dependencies]
tempfile = "3.23.0"


[features]

bundled = ["reqwest/native-tls-vendored", "matrix-sdk/bundled-sqlite"] # jiff timezone database?

[lints.rust]
# still refactoring
dead_code = "allow"

[lints.clippy]

all = { level = "warn", priority = -1 }
# pedantic = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }



missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Casts are bad
cast_possible_wrap = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"


# Performance lints
redundant_closure_for_method_calls = "warn"
redundant_clone = "warn"
or_fun_call = "warn"
map_unwrap_or = "warn"
unused_async = "warn"
trivially_copy_pass_by_ref = "warn"

# Style lints for code consistency
needless_return = "warn"
use_self = "warn"
explicit_iter_loop = "warn"

# Correctness lints
cast_lossless = "warn"
missing_const_for_fn = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
